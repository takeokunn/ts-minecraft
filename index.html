<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TypeScript implementation of Minecraft using Three.js and Effect-TS" />
    <link rel="icon" href="data:," />
    <title>ts-minecraft</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #game-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      body.weather-rain::before,
      body.weather-thunder::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        background-image: repeating-linear-gradient(
          105deg,
          rgba(180, 215, 255, 0.28) 0 2px,
          transparent 2px 12px
        );
        background-size: 72px 96px;
        mix-blend-mode: screen;
        animation: weather-rain-fall 0.42s linear infinite;
      }
      body.weather-thunder::before {
        opacity: 0.72;
        background-image: repeating-linear-gradient(
          105deg,
          rgba(210, 230, 255, 0.38) 0 2px,
          transparent 2px 10px
        );
      }
      body.weather-thunder::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        background: rgba(210, 235, 255, 0.22);
        opacity: 0;
        animation: weather-thunder-flash 5.5s steps(1, end) infinite;
      }
      @keyframes weather-rain-fall {
        from {
          background-position: 0 0;
        }
        to {
          background-position: -72px 96px;
        }
      }
      @keyframes weather-thunder-flash {
        0%,
        90%,
        100% {
          opacity: 0;
        }
        91% {
          opacity: 0.75;
        }
        92% {
          opacity: 0.15;
        }
        93% {
          opacity: 0.5;
        }
        94% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body.weather-rain::before,
        body.weather-thunder::before {
          animation: none;
        }
        body.weather-thunder::after {
          animation: none;
          opacity: 0.08;
        }
      }

      #underwater-screen-tint {
        position: fixed;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        opacity: 0;
        background:
          radial-gradient(circle at 50% 42%, rgba(130, 223, 255, 0.18), transparent 52%),
          linear-gradient(180deg, rgba(33, 139, 192, 0.32), rgba(7, 48, 86, 0.46));
        transition: opacity 140ms ease-out;
      }

      body.underwater-screen-tint #underwater-screen-tint {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        #underwater-screen-tint {
          transition: none;
        }
      }

      body.hud-hidden #fps-counter,
      body.hud-hidden #health-display,
      body.hud-hidden #absorption-display,
      body.hud-hidden #hunger-display,
      body.hud-hidden #armor-display,
      body.hud-hidden #air-display,
      body.hud-hidden #break-progress,
      body.hud-hidden #autosave-status,
      body.hud-hidden #effects-display,
      body.hud-hidden #xp-display,
      body.hud-hidden #survival-hud,
      body.hud-hidden #crosshair,
      body.hud-hidden #sound-captions,
      body.hud-hidden #debug-overlay {
        display: none !important;
      }

      #sound-captions {
        position: fixed;
        right: 12px;
        bottom: 96px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-end;
        pointer-events: none;
        z-index: 10;
      }

      .sound-caption-row {
        background: rgba(0, 0, 0, 0.6);
        color: #f0f0f0;
        font: 12px/1.4 monospace;
        padding: 3px 8px;
        border-left: 3px solid #e8c040;
        text-shadow: 1px 1px 0 #000;
      }

      #autosave-status {
        position: fixed;
        top: 42px;
        right: 10px;
        min-width: 68px;
        padding: 4px 9px;
        border: 1px solid rgba(215, 247, 194, 0.3);
        background: rgba(0, 0, 0, 0.35);
        color: #d7f7c2;
        font-family: monospace;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-shadow: 1px 1px 0 #000;
        pointer-events: none;
        text-align: center;
        z-index: 10;
      }

      #autosave-status:empty {
        opacity: 0;
      }

      #effects-display {
        position: fixed;
        top: 78px;
        right: 10px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        pointer-events: none;
        z-index: 10;
      }

      .effect-chip {
        padding: 3px 9px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.72);
        color: #e8e8e8;
        font-family: monospace;
        font-size: 12px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .effect-chip[data-effect="REGENERATION"] { color: #ff9ec4; border-color: rgba(255, 158, 196, 0.5); }
      .effect-chip[data-effect="POISON"] { color: #9fd66b; border-color: rgba(159, 214, 107, 0.5); }
      .effect-chip[data-effect="SPEED"] { color: #8fd3ff; border-color: rgba(143, 211, 255, 0.5); }
      .effect-chip[data-effect="SLOWNESS"] { color: #a9b7c6; border-color: rgba(169, 183, 198, 0.5); }
      .effect-chip[data-effect="HUNGER"] { color: #d8b46a; border-color: rgba(216, 180, 106, 0.5); }

      #autosave-status[data-save-status="saving"] {
        border-color: rgba(255, 227, 138, 0.62);
        color: #ffe38a;
      }

      #autosave-status[data-save-status="error"] {
        border-color: rgba(255, 114, 105, 0.76);
        background: rgba(85, 16, 14, 0.88);
        box-shadow: 0 0 0 1px rgba(255, 114, 105, 0.22);
        color: #ffd6d2;
      }

      #survival-hud {
        --vital-icon-size: clamp(12px, 4vw, 16px);
        --vital-icon-gap: clamp(1px, 0.45vw, 2px);
        position: fixed;
        left: 50%;
        /* Clear the THREE.js hotbar strip (slot centres sit 50px from the
           bottom, so the strip + selection border reach ~86px up). */
        bottom: 94px;
        transform: translateX(-50%);
        display: grid;
        gap: 3px;
        /* Match the hotbar width (9 * 60 + 8 * 10 = 620px) so the meters and
           XP bar align over the slots — health at the left end, hunger at the
           right end, vanilla-style. */
        width: min(620px, calc(100vw - 24px));
        pointer-events: none;
        z-index: 10;
        image-rendering: pixelated;
      }

      #survival-hud .hud-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 18px;
      }

      #survival-hud .hud-meter {
        display: grid;
        grid-template-columns: repeat(10, var(--vital-icon-size));
        gap: var(--vital-icon-gap);
        height: var(--vital-icon-size);
      }

      #survival-hud .hud-meter-icon {
        position: relative;
        width: var(--vital-icon-size);
        height: var(--vital-icon-size);
        filter: drop-shadow(1px 1px 0 #1b1b1b);
      }

      #survival-hud .hud-meter-icon::before,
      #survival-hud .hud-meter-icon::after {
        content: "";
        position: absolute;
        inset: 0;
      }

      #survival-hud .hud-meter-icon::before {
        background: #2d2d2d;
        opacity: 0.85;
      }

      #survival-hud .hud-meter-icon::after {
        background: var(--icon-fill, #fff);
      }

      #survival-hud .hud-meter-icon[data-fill="empty"]::after {
        opacity: 0;
      }

      #survival-hud .hud-meter-icon[data-fill="half"]::after {
        clip-path: inset(0 50% 0 0);
      }

      #health-display .hud-meter-icon::before,
      #health-display .hud-meter-icon::after,
      #absorption-display .hud-meter-icon::before,
      #absorption-display .hud-meter-icon::after {
        clip-path: polygon(12.5% 0, 37.5% 0, 37.5% 12.5%, 50% 12.5%, 62.5% 0, 87.5% 0, 87.5% 12.5%, 100% 12.5%, 100% 50%, 87.5% 50%, 87.5% 62.5%, 75% 62.5%, 75% 75%, 62.5% 75%, 62.5% 87.5%, 50% 87.5%, 50% 100%, 37.5% 100%, 37.5% 87.5%, 25% 87.5%, 25% 75%, 12.5% 75%, 12.5% 62.5%, 0 62.5%, 0 12.5%, 12.5% 12.5%);
      }

      #health-display .hud-meter-icon {
        --icon-fill: #c81919;
      }

      /* Absorption shield hearts (golden apple): golden row above health. */
      #absorption-display .hud-meter-icon {
        --icon-fill: #e8c53a;
      }

      #absorption-display[hidden] {
        display: none;
      }

      #health-display[data-state="warning"] .hud-meter-icon {
        --icon-fill: #ff5a3d;
      }

      #health-display[data-state="warning"],
      #hunger-display[data-state="warning"] {
        outline: 2px dashed currentColor;
        outline-offset: 2px;
      }

      #health-display[data-state="critical"] .hud-meter-icon {
        --icon-fill: #ff2424;
        --vital-glow: rgba(255, 36, 36, 0.85);
        animation: hud-vital-critical 0.7s steps(2, end) infinite;
      }

      #health-display[data-state="critical"],
      #hunger-display[data-state="critical"] {
        outline: 3px double currentColor;
        outline-offset: 2px;
      }

      #hunger-display .hud-meter-icon::before,
      #hunger-display .hud-meter-icon::after {
        clip-path: polygon(25% 0, 68.75% 0, 68.75% 12.5%, 81.25% 12.5%, 81.25% 25%, 93.75% 25%, 93.75% 50%, 81.25% 50%, 81.25% 62.5%, 68.75% 62.5%, 68.75% 75%, 56.25% 75%, 56.25% 87.5%, 43.75% 87.5%, 43.75% 100%, 18.75% 100%, 18.75% 87.5%, 31.25% 87.5%, 31.25% 75%, 43.75% 75%, 43.75% 62.5%, 25% 62.5%, 25% 50%, 12.5% 50%, 12.5% 25%, 25% 25%);
      }

      #hunger-display .hud-meter-icon {
        --icon-fill: #d18b2f;
      }

      #hunger-display[data-state="warning"] .hud-meter-icon {
        --icon-fill: #efb23b;
      }

      #hunger-display[data-state="critical"] .hud-meter-icon {
        --icon-fill: #ff7926;
        --vital-glow: rgba(255, 121, 38, 0.85);
        animation: hud-vital-critical 0.8s steps(2, end) infinite;
      }

      @keyframes hud-vital-critical {
        0%,
        100% {
          filter: drop-shadow(1px 1px 0 #1b1b1b);
          transform: translateY(0);
        }
        50% {
          filter: drop-shadow(1px 1px 0 #1b1b1b) drop-shadow(0 0 4px var(--vital-glow, rgba(255, 36, 36, 0.85)));
          transform: translateY(-1px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #health-display[data-state="critical"] .hud-meter-icon,
        #hunger-display[data-state="critical"] .hud-meter-icon,
        #xp-level.xp-level-up {
          animation: none;
        }
      }

      #armor-display {
        justify-self: start;
        height: 16px;
      }

      #armor-display .hud-meter-icon::before,
      #armor-display .hud-meter-icon::after {
        clip-path: polygon(25% 0, 75% 0, 75% 12.5%, 87.5% 12.5%, 87.5% 37.5%, 75% 37.5%, 75% 100%, 25% 100%, 25% 37.5%, 12.5% 37.5%, 12.5% 12.5%, 25% 12.5%);
      }

      #armor-display .hud-meter-icon {
        --icon-fill: #c8d2dc;
      }

      #xp-display {
        position: relative;
        width: 100%;
        height: 8px;
        background: #1b1b1b;
        border: 2px solid #050505;
        box-shadow: inset 0 0 0 1px #4b4b4b, 1px 1px 0 #0b0b0b;
      }

      #xp-progress-fill {
        display: block;
        width: 0%;
        height: 100%;
        background: linear-gradient(#a8ff58 0 37.5%, #4fae24 37.5% 75%, #277410 75%);
      }

      #xp-level {
        position: absolute;
        top: -22px;
        left: 50%;
        transform: translateX(-50%);
        color: #7dff4f;
        font: 700 16px/1 "Courier New", monospace;
        text-shadow: 1px 1px 0 #163d0c, -1px -1px 0 #163d0c, 1px -1px 0 #163d0c, -1px 1px 0 #163d0c;
      }

      /* Level-up flourish: the sound cue's visual twin (redundant channels). */
      #xp-level.xp-level-up {
        animation: xp-level-pop 0.6s ease-out;
      }

      @keyframes xp-level-pop {
        0%,
        100% {
          transform: translateX(-50%) scale(1);
        }
        30% {
          transform: translateX(-50%) scale(1.7);
          filter: drop-shadow(0 0 6px rgba(125, 255, 79, 0.9));
        }
      }

      /* Colorblind correction (settings > Accessibility). Canvas-only: a filter on
         body would turn it into the containing block for every position:fixed HUD
         element, and the HUD already carries icon/shape/numeric redundancy. */
      body[data-color-vision="protanopia"] #game-canvas {
        filter: url(#color-vision-protanopia);
      }

      body[data-color-vision="deuteranopia"] #game-canvas {
        filter: url(#color-vision-deuteranopia);
      }

      body[data-color-vision="tritanopia"] #game-canvas {
        filter: url(#color-vision-tritanopia);
      }

      .hud-numeric {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body class="hud-hidden">
    <!-- Daltonization correction filters: C = I + E·(I−S) where S simulates the
         deficiency and E redistributes the lost channel onto the intact ones.
         Every row sums to 1, so whites and grays pass through unchanged.
         color-interpolation-filters=sRGB: matrices are derived in sRGB space —
         the SVG default (linearRGB) would over-brighten midtones. -->
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0" focusable="false">
      <filter id="color-vision-protanopia" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="1 0 0 0 0  -0.2549 1.2549 0 0 0  0.3031 -0.5451 1.242 0 0  0 0 0 1 0" />
      </filter>
      <filter id="color-vision-deuteranopia" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="1 0 0 0 0  -0.4375 1.4375 0 0 0  0.2625 -0.5625 1.3 0 0  0 0 0 1 0" />
      </filter>
      <filter id="color-vision-tritanopia" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="1 0 0 0 0  0.035 1.532 -0.567 0 0  0.035 -0.51 1.475 0 0  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="app"></div>
    <div id="multiplayer-root"></div>
    <canvas id="game-canvas"></canvas>
    <div id="underwater-screen-tint" aria-hidden="true"></div>
    <div id="fps-counter" style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.35); color: #f0f0f0; padding: 4px 9px; font-family: monospace; font-size: 12px; text-shadow: 1px 1px 0 #000; pointer-events: none; z-index: 10;">
      FPS: <span id="fps-value">0</span>
    </div>
    <div id="autosave-status" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="sound-captions" role="log" aria-live="polite" aria-label="Sound captions"></div>
    <div id="effects-display" aria-label="Active effects"></div>
    <div id="survival-hud">
      <div id="armor-display" class="hud-meter" aria-label="Armor">
        <span class="hud-meter-icon" data-hud-icon data-fill="empty"></span><span class="hud-meter-icon" data-hud-icon data-fill="empty"></span><span class="hud-meter-icon" data-hud-icon data-fill="empty"></span><span class="hud-meter-icon" data-hud-icon data-fill="empty"></span><span class="hud-meter-icon" data-hud-icon data-fill="empty"></span><span class="hud-meter-icon" data-hud-icon data-fill="empty"></span><span class="hud-meter-icon" data-hud-icon data-fill="empty"></span><span class="hud-meter-icon" data-hud-icon data-fill="empty"></span><span class="hud-meter-icon" data-hud-icon data-fill="empty"></span><span class="hud-meter-icon" data-hud-icon data-fill="empty"></span>
        <span id="armor-value" class="hud-numeric">0</span>
      </div>
      <div id="absorption-display" class="hud-meter" aria-label="Absorption hearts" hidden></div>
      <div class="hud-row">
        <div id="health-display" class="hud-meter" data-state="normal" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20" aria-valuetext="20 of 20, normal">
          <span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span>
          <span id="health-value" class="hud-numeric">20</span><span id="health-max" class="hud-numeric">20</span>
        </div>
        <div id="hunger-display" class="hud-meter" data-state="normal" role="meter" aria-label="Hunger" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20" aria-valuetext="20 of 20, normal">
          <span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span><span class="hud-meter-icon" data-hud-icon data-fill="full"></span>
          <span id="hunger-value" class="hud-numeric">20</span><span id="hunger-max" class="hud-numeric">20</span>
        </div>
      </div>
      <div id="xp-display" aria-label="Experience">
        <span id="xp-progress-fill"></span>
        <span id="xp-level">0</span>
        <span id="xp-bar" class="hud-numeric">0</span><span id="xp-bar-max" class="hud-numeric">7</span>
      </div>
    </div>
    <!-- Air/oxygen (FR-2): hidden until the head is underwater; physics-stage toggles display + bubble count. -->
    <div id="air-display" style="display: none; position: fixed; bottom: 170px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.35); color: #7ec8ff; padding: 5px 12px; font-family: monospace; font-size: 16px; text-shadow: 1px 1px 0 #000; pointer-events: none; z-index: 10;"></div>
    <!-- Block break progress: hidden until left-click held on a block; interaction-stage updates value/max each frame. -->
    <progress id="break-progress" value="0" max="100" style="display: none; position: fixed; top: calc(50% + 20px); left: 50%; transform: translateX(-50%); width: 140px; height: 8px; pointer-events: none; z-index: 10; accent-color: #e8c040;"></progress>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
